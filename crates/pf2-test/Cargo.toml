[package]
name = "pf2-test"
version = "0.1.0"
edition = "2024"

[dependencies]
protofish2 = { path = "../..", features = ["jitter", "opus"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1"
ogg = "0.9"
opus = "0.3"
rodio = "0.20"
rcgen = { version = "0.14", features = ["pem"] }
rustls = "0.23"
rustls-pemfile = "2"
